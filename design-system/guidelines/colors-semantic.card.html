<!-- @dsCard group="Colors" viewport="700x120" name="Difficulty Tags" subtitle="Easy / Medium / Hard labels on pose cards" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:12px;height:120px;align-items:center;padding:0 20px;background:var(--bg-warm);font-family:var(--font-body)">
<span style="background:var(--difficulty-easy);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-pill)">Easy</span>
<span style="background:var(--difficulty-medium);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-pill)">Medium</span>
<span style="background:var(--difficulty-hard);color:#fff;font-size:12px;font-weight:600;padding:6px 14px;border-radius:var(--radius-pill)">Hard</span>
</div>
